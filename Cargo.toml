[package]
name = "compiler-rs-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
log = "0.4.29"
lsp-types = "0.97.0"
markdown = "1.0.0"
serde = {version="1.0.228", features=["std","derive"]}
serde_json = "1.0.145"
walkdir = "2.5.0"

[lib]
crate-type = ["cdylib","lib"]

[profile.release]
lto = true
panic = "abort"
